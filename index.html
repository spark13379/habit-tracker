<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Rastreador de Hábitos</h1>

    <div id="auth">
      <input type="text" id="username" placeholder="Usuário" />
      <input type="password" id="password" placeholder="Senha" />
      <button onclick="login()">Entrar</button>
      <button onclick="register()">Registrar</button>
    </div>

    <form id="habit-form" style="display: none;">
      <input type="text" id="habit-name" placeholder="Novo hábito" required />
      <input type="date" id="habit-date" required />
      <button type="submit">Adicionar</button>
    </form>

    <ul id="habit-list"></ul>
  </div>

  <script>
    async function register() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const res = await fetch("http://localhost:8000/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.access_token) {
        localStorage.setItem("token", data.access_token);
        document.getElementById("auth").style.display = "none";
        document.getElementById("habit-form").style.display = "block";
        loadHabits();
      }
    }

    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const form = new URLSearchParams();
      form.append("username", username);
      form.append("password", password);

      const res = await fetch("http://localhost:8000/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form
      });
      const data = await res.json();
      if (data.access_token) {
        localStorage.setItem("token", data.access_token);
        document.getElementById("auth").style.display = "none";
        document.getElementById("habit-form").style.display = "block";
        loadHabits();
      }
    }

    // Exibe formulário direto se o token já estiver salvo
    if (localStorage.getItem("token")) {
      document.getElementById("auth").style.display = "none";
      document.getElementById("habit-form").style.display = "block";
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
